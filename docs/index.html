<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SeedSigner Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Official documentation for SeedSigner — an open-source, air-gapped Bitcoin signing device.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="theme-color" content="#f6851b">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0.9.0/dist/css/theme-simple.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1.3.5/dist/sidebar.min.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <style>
    :root {
      --theme-color: #f6851b;
      --sidebar-background: #fff;
      --sidebar-nav-background: #fff;
      --sidebar-nav-link-color--active: #f6851b;
      --sidebar-nav-link-border-color--active: #f6851b;
      --sidebar-name-color: #f6851b;
      --link-color: #f6851b;
      --link-color--hover: #d4710f;
      --blockquote-border-color: #f6851b;
      --notice-tip-border-color: #f6851b;
    }
    /*
      Active L1 (top-level section): orange for section title + chevron.
      Docsify often puts .active on the leaf li only; :has(> ul li.active) styles the open section row.
    */
    .sidebar-nav > ul > li.active > a,
    .sidebar-nav > ul > li:has(> ul li.active) > a {
      color: var(--theme-color, #f6851b) !important;
    }
    .sidebar-nav > ul > li.active > p,
    .sidebar-nav > ul > li.active > p strong,
    .sidebar-nav > ul > li.active > strong,
    .sidebar-nav > ul > li:has(> ul li.active) > p,
    .sidebar-nav > ul > li:has(> ul li.active) > p strong,
    .sidebar-nav > ul > li:has(> ul li.active) > strong {
      color: var(--theme-color, #f6851b) !important;
    }
    .sidebar-nav > ul > li.active.folder::before,
    .sidebar-nav > ul > li.active.folder.open::before,
    .sidebar-nav > ul > li.active.folder.collapse::before,
    .sidebar-nav > ul > li:has(> ul li.active).folder::before,
    .sidebar-nav > ul > li:has(> ul li.active).folder.open::before,
    .sidebar-nav > ul > li:has(> ul li.active).folder.collapse::before {
      border-right-color: var(--theme-color, #f6851b) !important;
      border-bottom-color: var(--theme-color, #f6851b) !important;
    }
    .sidebar .app-name {
      text-align: center;
      padding: 20px 0 10px;
    }
    .sidebar .app-name img {
      max-width: 160px;
    }
    /* Top-level direct page link (Home is a single page, not an expandable section): match section-header weight */
    .sidebar-nav > ul > li > a {
      font-weight: 700;
    }
    .markdown-section h1 {
      border-bottom: 2px solid #f6851b;
      padding-bottom: 0.3em;
    }
    .markdown-section table {
      display: table;
      width: 100%;
    }
    .warning-box {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 12px 16px;
      margin: 16px 0;
      border-radius: 4px;
    }
    .danger-box {
      background: #f8d7da;
      border-left: 4px solid #dc3545;
      padding: 12px 16px;
      margin: 16px 0;
      border-radius: 4px;
    }
    .tip-box {
      background: #d4edda;
      border-left: 4px solid #28a745;
      padding: 12px 16px;
      margin: 16px 0;
      border-radius: 4px;
    }
    /* === Diagram components (ss-*) ===================================
       Semantic HTML diagrams authored directly in markdown (see
       docs/contribute/docs.md → "Diagrams"). Conventions:
       blue = networked coordinator (left lane), orange = air-gapped
       SeedSigner (right lane), dashed line = the air gap.

       Design rules this block enforces, so diagrams stay legible as they
       grow: lane identity is carried by ONE rule plus ONE coloured
       numeral — never by a background fill as well; body copy stays in
       ink rather than lane colour; and the only filled row in a figure
       is a --warn step, so "this is the step that matters" still reads
       as an exception. Heads and steps share --ss-gutter so the lanes
       line up.
       All colours flow through --ss-* tokens so a future dark mode only
       needs to override this one block. */
    :root {
      --ss-device-accent: var(--theme-color, #f6851b);
      --ss-device-accent-strong: #b35a08; /* >=4.5:1 with white text */
      --ss-device-text: #8a4a00;
      --ss-computer-accent: #2f6bc4;
      --ss-computer-text: #1d4f91;
      --ss-diagram-bg: #fff;
      --ss-diagram-text: #3b454e;
      --ss-diagram-muted: #6a7580;
      --ss-warn-accent: #ffc107;
      --ss-warn-bg: #fff9e8;
      --ss-warn-text: #7a5b00;
      --ss-ink: #222a32;       /* step titles */
      --ss-ink-2: #5d6874;     /* sub-lines and kickers */
      --ss-hair: #e5e9ee;      /* borders and the phase spine */
      --ss-gap-line: #b6c0cb;  /* the air gap — neutral, so it reads as a
                                  divider rather than part of the orange lane */
      --ss-gutter: 5.75rem;    /* width of the air-gap channel; shared by the
                                  lane heads and the step grid so they align */
    }
    .markdown-section .ss-diagram {
      margin: 1.5em 0;
      padding: 1.5rem 1.5rem 1.15rem;
      background: var(--ss-diagram-bg);
      border: 1px solid var(--ss-hair);
      border-radius: 8px;
      color: var(--ss-ink);
      font-size: 0.9rem;
      line-height: 1.45;
    }
    .markdown-section .ss-diagram ol,
    .markdown-section .ss-diagram ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .markdown-section .ss-caption {
      margin-top: 0.9rem;
      text-align: center;
      font-size: 0.79rem;
      line-height: 1.5;
      color: var(--ss-diagram-muted);
    }
    .markdown-section .ss-sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
    /* Swimlane (two-lane step flow with the air gap down the middle) */
    .markdown-section .ss-lane-heads {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: var(--ss-gutter);
      align-items: end;
      margin-bottom: 0.85rem;
    }
    .markdown-section .ss-lane-head {
      display: block;
      padding: 0 0 0.45rem;
      border-bottom: 2px solid;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--ss-ink);
      min-width: 0;
    }
    .markdown-section .ss-lane-head em {
      display: block;
      margin-top: 0.1rem;
      font-style: normal;
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--ss-ink-2);
    }
    .markdown-section .ss-lane-head--computer { border-bottom-color: var(--ss-computer-accent); }
    .markdown-section .ss-lane-head--device { border-bottom-color: var(--ss-device-accent); }
    /*
      Absolutely positioned, so it is skipped by grid auto-placement and the
      two lane heads still land in the two columns regardless of DOM order.
    */
    .markdown-section .ss-gap-label {
      position: absolute;
      left: 50%;
      bottom: 0.5rem;
      transform: translateX(-50%);
      padding: 0 0.3rem;
      background: var(--ss-diagram-bg);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--ss-diagram-muted);
      white-space: nowrap;
    }
    .markdown-section ol.ss-steps {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: var(--ss-gutter);
      row-gap: 0.4rem;
    }
    /* The air gap: one continuous channel from the lane rules to the last step */
    .markdown-section ol.ss-steps::before {
      content: "";
      position: absolute;
      top: -0.85rem;
      bottom: 0;
      left: 50%;
      border-left: 1px dashed var(--ss-gap-line);
    }
    .markdown-section li.ss-step {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      padding: 0.5rem 0 0.5rem 0.8rem;
      border-left: 2px solid transparent;
      min-width: 0;
      overflow-wrap: break-word;
    }
    .markdown-section li.ss-step--computer {
      grid-column: 1;
      border-left-color: var(--ss-computer-accent);
    }
    .markdown-section li.ss-step--device {
      grid-column: 2;
      border-left-color: var(--ss-device-accent);
    }
    .markdown-section li.ss-step--span {
      grid-column: 1 / -1;
      z-index: 1;
      border-left-color: var(--ss-gap-line);
      background: var(--ss-diagram-bg);
    }
    .markdown-section li.ss-step--handoff {
      grid-column: 1 / -1;
      z-index: 1;
      align-items: stretch;
      gap: 0.75rem;
      padding: 0;
      border-left: none;
    }
    .markdown-section li.ss-step--handoff > .ss-step-num { align-self: center; }
    .markdown-section .ss-handoff-half {
      flex: 1 1 0;
      padding: 0.5rem 0 0.5rem 0.8rem;
      border-left: 2px solid;
      min-width: 0;
      overflow-wrap: break-word;
    }
    .markdown-section .ss-handoff-half--computer { border-left-color: var(--ss-computer-accent); }
    .markdown-section .ss-handoff-half--device { border-left-color: var(--ss-device-accent); }
    /*
      --warn is defined after the lane variants so it wins when combined.
      This is deliberately the only filled row in the system.
    */
    .markdown-section li.ss-step--warn {
      border-left-color: var(--ss-warn-accent);
      background: var(--ss-warn-bg);
      border-radius: 0 5px 5px 0;
      padding-right: 0.7rem;
    }
    .markdown-section .ss-step-num {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.35rem;
      height: 1.35rem;
      margin-top: 0.08rem;
      border-radius: 50%;
      background: var(--ss-diagram-muted);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .markdown-section li.ss-step--computer .ss-step-num { background: var(--ss-computer-accent); }
    .markdown-section li.ss-step--device .ss-step-num { background: var(--ss-device-accent-strong); }
    /* A warn step is an exception, so it owns the whole row rather than
       showing an amber rule against a lane-coloured numeral. */
    .markdown-section li.ss-step--warn .ss-step-num { background: #946c00; }
    .markdown-section .ss-step-body {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--ss-ink);
    }
    .markdown-section .ss-step-body small {
      display: block;
      margin-top: 0.12rem;
      font-size: 0.78rem;
      font-weight: 400;
      line-height: 1.45;
      color: var(--ss-ink-2);
    }
    .markdown-section .ss-qr-badge {
      position: absolute;
      top: 50%;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      padding: 0.13rem 0.42rem;
      border-radius: 4px;
      background: var(--ss-diagram-bg);
      box-shadow: 0 0 0 1px var(--ss-device-accent);
      color: var(--ss-device-accent-strong);
      font-size: 0.63rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    /* Centre the badge on the dashed air-gap line (half the gutter) */
    .markdown-section li.ss-step--device > .ss-qr-badge {
      left: calc(var(--ss-gutter) / -2);
      transform: translate(-50%, -50%);
    }
    .markdown-section li.ss-step--computer > .ss-qr-badge {
      right: calc(var(--ss-gutter) / -2);
      transform: translate(50%, -50%);
    }
    .markdown-section li.ss-step--handoff > .ss-qr-badge {
      position: static;
      transform: none;
      flex-shrink: 0;
      align-self: center;
    }
    .markdown-section .ss-lane-tag {
      display: none;
    }
    .markdown-section .ss-chip {
      flex-shrink: 0;
      align-self: center;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      box-shadow: 0 0 0 1px currentColor;
      background: var(--ss-diagram-bg);
      font-size: 0.66rem;
      font-weight: 700;
    }
    /*
      Vertical flow (single column, no lane heads): with no columns to read
      position from, the lane tag is shown at every width.
    */
    .markdown-section ol.ss-flow {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .markdown-section ol.ss-flow li.ss-step { align-items: center; }
    .markdown-section ol.ss-flow .ss-lane-tag {
      display: block;
      margin-bottom: 0.05rem;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .markdown-section ol.ss-flow .ss-lane-tag--computer { color: var(--ss-computer-accent); }
    .markdown-section ol.ss-flow .ss-lane-tag--device { color: var(--ss-device-accent-strong); }
    /* Architecture panel (homepage) */
    .markdown-section .ss-arch-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      column-gap: 1rem;
      row-gap: 0.55rem;
      align-items: stretch;
    }
    .markdown-section .ss-node {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.1rem;
      padding: 0.9rem 1rem;
      border: 1px solid var(--ss-hair);
      border-top: 3px solid;
      border-radius: 6px;
      min-width: 0;
      overflow-wrap: break-word;
    }
    .markdown-section .ss-node--computer { border-top-color: var(--ss-computer-accent); }
    .markdown-section .ss-node--device { border-top-color: var(--ss-device-accent); }
    .markdown-section .ss-node-kicker {
      font-size: 0.63rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ss-ink-2);
    }
    .markdown-section .ss-node-title {
      font-size: 1.05rem;
      color: var(--ss-ink);
    }
    .markdown-section .ss-node-sub {
      font-size: 0.79rem;
      color: var(--ss-ink-2);
    }
    .markdown-section .ss-airgap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0 0.5rem;
      min-width: 8rem;
    }
    .markdown-section .ss-airgap::before {
      content: "";
      position: absolute;
      top: -0.4rem;
      bottom: -0.4rem;
      left: 50%;
      border-left: 1px dashed var(--ss-gap-line);
    }
    .markdown-section .ss-airgap-label {
      position: relative;
      z-index: 1;
      padding: 0.1rem 0.35rem;
      background: var(--ss-diagram-bg);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--ss-diagram-muted);
    }
    .markdown-section .ss-qr-link {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      padding: 0.22rem 0.55rem;
      border-radius: 4px;
      background: var(--ss-diagram-bg);
      box-shadow: 0 0 0 1px var(--ss-device-accent);
      color: var(--ss-device-accent-strong);
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .markdown-section .ss-endpoint {
      padding: 0 0.1rem;
      font-size: 0.78rem;
      line-height: 1.45;
      color: var(--ss-ink-2);
    }
    .markdown-section .ss-endpoint strong { color: var(--ss-ink); }
    /*
      Phase strip (build journey). The steps are one continuous 1..N
      sequence, so they hang off one continuous spine; the phases are
      labelled bands along it rather than three separate cards.
    */
    .markdown-section .ss-phase-spine {
      position: relative;
    }
    .markdown-section .ss-phase-spine::before {
      content: "";
      position: absolute;
      top: 0.85rem;
      bottom: 0.85rem;
      left: 0.72rem;
      border-left: 2px solid var(--ss-hair);
    }
    .markdown-section .ss-phase {
      position: relative;
      padding: 0.1rem 0 0.7rem;
      min-width: 0;
    }
    .markdown-section .ss-phase-kicker {
      display: block;
      padding-left: 2.35rem;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--ss-ink-2);
    }
    .markdown-section .ss-phase--critical .ss-phase-kicker { color: #946c00; }
    .markdown-section .ss-phase-title {
      display: block;
      padding-left: 2.35rem;
      margin: 0.02rem 0 0.3rem;
      font-size: 1rem;
      font-weight: 700;
      color: var(--ss-ink);
    }
    .markdown-section ol.ss-phase-steps li {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.16rem 0;
      font-size: 0.86rem;
      line-height: 1.4;
    }
    .markdown-section .ss-pn {
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 50%;
      background: var(--ss-diagram-bg);
      color: var(--ss-ink-2);
      font-size: 0.7rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 0 0 2px var(--ss-hair) inset, 0 0 0 4px var(--ss-diagram-bg);
    }
    .markdown-section .ss-phase--critical .ss-pn {
      color: #946c00;
      box-shadow: 0 0 0 2px var(--ss-warn-accent) inset, 0 0 0 4px var(--ss-diagram-bg);
    }
    @media (max-width: 700px) {
      .markdown-section .ss-lane-heads {
        display: none;
      }
      .markdown-section ol.ss-steps {
        grid-template-columns: 1fr;
        column-gap: 0;
        row-gap: 0.45rem;
      }
      .markdown-section ol.ss-steps::before {
        display: none;
      }
      .markdown-section li.ss-step--computer,
      .markdown-section li.ss-step--device {
        grid-column: 1;
      }
      /*
        A handoff is two lanes acting in turn. Side by side at 375px gives
        three-word line lengths, so stack it: half, crossing, half.
      */
      .markdown-section li.ss-step--handoff {
        flex-wrap: wrap;
        align-items: flex-start;
        row-gap: 0.4rem;
      }
      .markdown-section li.ss-step--handoff > .ss-step-num { align-self: flex-start; }
      .markdown-section li.ss-step--handoff > .ss-handoff-half:first-of-type {
        flex: 1 1 calc(100% - 2.2rem);
      }
      .markdown-section li.ss-step--handoff > .ss-handoff-half:last-of-type {
        flex: 1 1 100%;
        margin-left: 2.2rem;
      }
      .markdown-section li.ss-step--handoff > .ss-qr-badge {
        margin-left: 2.2rem;
        align-self: flex-start;
      }
      /* Columns are gone, so each step states its own lane */
      .markdown-section .ss-lane-tag {
        display: block;
        margin-bottom: 0.05rem;
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .markdown-section .ss-lane-tag--computer { color: var(--ss-computer-accent); }
      .markdown-section .ss-lane-tag--device { color: var(--ss-device-accent-strong); }
      .markdown-section li.ss-step--device > .ss-qr-badge,
      .markdown-section li.ss-step--computer > .ss-qr-badge {
        position: static;
        transform: none;
        margin-left: auto;
        align-self: center;
      }
      .markdown-section .ss-arch-grid {
        grid-template-columns: 1fr;
      }
      .markdown-section .ss-arch-grid .ss-node--computer { order: 1; }
      .markdown-section .ss-arch-grid .ss-endpoint--computer { order: 2; }
      .markdown-section .ss-arch-grid .ss-airgap { order: 3; }
      .markdown-section .ss-arch-grid .ss-node--device { order: 4; }
      .markdown-section .ss-arch-grid .ss-endpoint--device { order: 5; }
      .markdown-section .ss-arch-spacer {
        display: none;
      }
      .markdown-section .ss-airgap {
        flex-direction: row;
        justify-content: center;
        gap: 0.6rem;
        padding: 0.35rem 0;
        min-width: 0;
      }
      .markdown-section .ss-airgap::before {
        top: 50%;
        bottom: auto;
        left: 0;
        right: 0;
        border-left: none;
        border-top: 1px dashed var(--ss-gap-line);
      }
      /* Stacked nodes exchange up/down, so rotate the QR pill arrows */
      .markdown-section .ss-qr-link span[aria-hidden] {
        display: inline-block;
        transform: rotate(90deg);
      }
    }
    @media print {
      .markdown-section .ss-diagram {
        break-inside: avoid;
        border-color: #999;
      }
      .markdown-section .ss-step-num,
      .markdown-section .ss-pn,
      .markdown-section .ss-lane-tag,
      .markdown-section li.ss-step--warn {
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
    }
    /* === End diagram components === */
    /* Nested sidebar labels (no page link): heading only, no chevron, links always visible */
    .sidebar-nav li.sidebar-subheading {
      cursor: default;
      margin-bottom: 0 !important;
    }
    .sidebar-nav li.sidebar-subheading::before {
      display: none !important;
    }
    .sidebar-nav li.sidebar-subheading > ul {
      display: block !important;
      margin-left: 0 !important;
    }
    .sidebar-nav > ul > li > ul > li.sidebar-subheading > p {
      margin-top: 0.5em !important;
    }
    .sidebar-nav > ul > li > ul > li.sidebar-subheading > strong {
      margin-top: 1.5em !important;
    }
    .sidebar-nav > ul > li > ul > li.sidebar-subheading p strong {
      margin-top: 0 !important;
    }
    /* L2 subheads: no underline (theme uses border-bottom on strong) */
    .sidebar-nav li.sidebar-subheading > p,
    .sidebar-nav li.sidebar-subheading > strong,
    .sidebar-nav li.sidebar-subheading p,
    .sidebar-nav li.sidebar-subheading strong {
      border: none !important;
      border-bottom: none !important;
      text-decoration: none !important;
      margin-bottom: 0 !important;
    }
    /*
      L2 under a top-level section: same left inset for direct links (Quick-start checklist)
      and subheadings (SEEDS, BUILD YOUR DEVICE). Section list stays flush; each L2 li indents.
    */
    .sidebar-nav > ul > li > ul {
      margin-left: 0 !important;
      padding-left: 0 !important;
    }
    .sidebar-nav > ul > li > ul > li {
      margin-left: var(--sidebar-nav-indent, 1em) !important;
    }
    .sidebar-nav > ul > li > ul ul {
      margin-left: var(--sidebar-nav-indent, 1em) !important;
    }
    /* Direct L2 page links only (not links inside a subheading’s nested ul) */
    .sidebar-nav > ul > li > ul > li > a[href^="#/"]:not([href*="?id="]),
    .sidebar-nav > ul > li > ul > li > a[href^="/"]:not([href*="?id="]) {
      padding-left: var(--sidebar-nav-link-padding, 0.25em 0) !important;
      font-size: 0.9rem !important;
    }
    /* Top-level section chevron (docsify-sidebar-collapse): align to the right, mirror so open/closed still read correctly */
    .sidebar-nav > ul > li.folder:not(.sidebar-subheading) {
      padding-right: 1.1rem;
    }
    .sidebar-nav > ul > li.folder:not(.sidebar-subheading)::before {
      left: auto !important;
      right: 0.15rem;
      border-right-color: var(--sidebar-nav-link-color, var(--base-color, #505d6b)) !important;
      border-bottom-color: var(--sidebar-nav-link-color, var(--base-color, #505d6b)) !important;
      transform: scaleX(-1) rotate(135deg) !important;
    }
    .sidebar-nav > ul > li.folder:not(.sidebar-subheading).open::before {
      transform: scaleX(-1) rotate(45deg) !important;
    }
    .sidebar-nav > ul > li.folder:not(.sidebar-subheading).collapse::before {
      transform: scaleX(-1) rotate(135deg) !important;
    }
    /*
      Two sources of nested “chevrons”:
      1) docsify-sidebar-collapse: li::before triangle
      2) docsify-themeable: --sidebar-nav-pagelink-* backgrounds on any a:not(:only-child)
      Keep expand affordance only on top-level section rows (.sidebar-nav > ul > li).
    */
    .sidebar-nav > ul > li ul li::before,
    .sidebar-nav > ul > li ul li.open::before,
    .sidebar-nav > ul > li ul li.collapse::before {
      content: none !important;
      display: none !important;
      border: none !important;
      width: 0 !important;
      height: 0 !important;
      transform: none !important;
    }
    .sidebar-nav > ul > li ul a[href^="#/"]:not([href*="?id="]),
    .sidebar-nav > ul > li ul a[href^="/"]:not([href*="?id="]) {
      background: var(--sidebar-nav-link-background, transparent) !important;
    }
    /* Under an L2 subheading: no extra ul margin (above) and no theme pagelink left padding */
    .sidebar-nav li.sidebar-subheading ul a[href^="#/"]:not([href*="?id="]),
    .sidebar-nav li.sidebar-subheading ul a[href^="/"]:not([href*="?id="]) {
      padding: var(--sidebar-nav-link-padding, 0.25em 0) !important;
      font-size: 0.9rem !important;
    }
    .sidebar-nav li.sidebar-subheading ul a[href^="#/"]:not([href*="?id="]):hover,
    .sidebar-nav li.sidebar-subheading ul a[href^="/"]:not([href*="?id="]):hover {
      padding: var(--sidebar-nav-link-padding, 0.25em 0) !important;
    }
    .sidebar-nav li.sidebar-subheading ul li.active > a[href^="#/"]:not([href*="?id="]),
    .sidebar-nav li.sidebar-subheading ul li.active > a[href^="/"]:not([href*="?id="]),
    .sidebar-nav li.sidebar-subheading ul li.active > a[href^="#/"]:not([href*="?id="]):hover,
    .sidebar-nav li.sidebar-subheading ul li.active > a[href^="/"]:not([href*="?id="]):hover {
      padding: var(--sidebar-nav-link-padding, 0.25em 0) !important;
    }
    .sidebar-nav li.sidebar-subheading ul li.collapse > a[href^="#/"]:not([href*="?id="]),
    .sidebar-nav li.sidebar-subheading ul li.collapse > a[href^="/"]:not([href*="?id="]) {
      padding: var(--sidebar-nav-link-padding, 0.25em 0) !important;
    }
    .sidebar-nav > ul > li ul a[href^="#/"]:not([href*="?id="]):hover,
    .sidebar-nav > ul > li ul a[href^="/"]:not([href*="?id="]):hover {
      background: var(--sidebar-nav-link-background--hover, var(--sidebar-nav-link-background, transparent)) !important;
    }
    .sidebar-nav > ul > li ul li.active > a[href^="#/"]:not([href*="?id="]),
    .sidebar-nav > ul > li ul li.active > a[href^="/"]:not([href*="?id="]) {
      background: var(--sidebar-nav-link-background--active, var(--sidebar-nav-link-background, transparent)) !important;
    }
    .sidebar-nav > ul > li ul li.active > a[href^="#/"]:not([href*="?id="]):hover,
    .sidebar-nav > ul > li ul li.active > a[href^="/"]:not([href*="?id="]):hover {
      background: var(--sidebar-nav-link-background--active, var(--sidebar-nav-link-background, transparent)) !important;
    }
    .sidebar-nav > ul > li ul li.collapse > a[href^="#/"]:not([href*="?id="]),
    .sidebar-nav > ul > li ul li.collapse > a[href^="/"]:not([href*="?id="]) {
      background: var(--sidebar-nav-link-background--active, var(--sidebar-nav-link-background, transparent)) !important;
    }
    /* Search field alignment: center X icon vertically with text and magnifying glass */
    .search .clear-button {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '<img src="images/SeedSigner_Logo.png" alt="SeedSigner" />',
      nameLink: '/',
      //repo: 'https://github.com/SeedSigner/seedsigner',
      loadNavbar: true,
      loadSidebar: true,
      /* 0 = do not inject in-page heading anchors under the active sidebar link */
      subMaxLevel: 0,
      auto2top: true,
      search: {
        placeholder: 'Search docs...',
        noData: 'No results found.',
        paths: 'auto',
        depth: 3,
        /* Bump when page content changes shape (e.g. the diagram rework) so
           returning visitors don't search a stale localStorage index. */
        namespace: 'seedsigner-docs-v2'
      },
      copyCode: {
        buttonText: 'Copy',
        successText: 'Copied'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true
      },
      themeColor: '#f6851b',
      notFoundPage: true,
      /*
        Redirects for the pre-restructure URLs. Each old route (with or without a
        trailing .md) resolves to its new location so existing bookmarks and inbound
        links keep working after the journey-first IA move.
      */
      alias: {
        '/overview(\\.md)?': '/README.md',
        '/getting-started/checklist(\\.md)?': '/get-started/build-device.md',
        '/getting-started/first-boot(\\.md)?': '/reference/device/first-boot.md',
        '/getting-started/navigation(\\.md)?': '/reference/device/navigation.md',
        '/getting-started/power-off(\\.md)?': '/reference/device/power.md',
        '/hardware-build/components(\\.md)?': '/reference/hardware/components.md',
        '/hardware-build/sourcing(\\.md)?': '/reference/hardware/sourcing.md',
        '/hardware-build/assembly(\\.md)?': '/reference/hardware/assembly.md',
        '/hardware-build/enclosures(\\.md)?': '/reference/hardware/enclosures.md',
        '/software-setup/download-and-verify(\\.md)?': '/reference/software/verify-image.md',
        '/software-setup/write-sd-card(\\.md)?': '/reference/software/flash-sd-card.md',
        '/software-setup/first-run(\\.md)?': '/reference/software/first-run.md',
        '/using-seedsigner/single-sig-walkthrough(\\.md)?': '/get-started/first-wallet.md',
        '/using-seedsigner/create-seed(\\.md)?': '/reference/seeds/creation.md',
        '/using-seedsigner/load-seed(\\.md)?': '/reference/seeds/loading.md',
        '/using-seedsigner/seedqr-backup(\\.md)?': '/reference/seeds/seedqr.md',
        '/using-seedsigner/view-seeds(\\.md)?': '/reference/seeds/verification.md',
        '/using-seedsigner/discard-seed(\\.md)?': '/reference/seeds/discard.md',
        '/using-seedsigner/export-xpub(\\.md)?': '/reference/keys/xpub-export.md',
        '/using-seedsigner/addresses(\\.md)?': '/reference/keys/address-explorer.md',
        '/using-seedsigner/sign-transaction(\\.md)?': '/reference/keys/psbt-signing.md',
        '/security/multisig-walkthrough(\\.md)?': '/get-started/multisig.md',
        '/security/multisig-spend(\\.md)?': '/reference/multisig/spending.md',
        '/security/wallet-descriptor(\\.md)?': '/reference/multisig/descriptor.md',
        '/configuration/basic(\\.md)?': '/reference/settings/basic.md',
        '/configuration/advanced(\\.md)?': '/reference/settings/advanced.md',
        '/configuration/hardware(\\.md)?': '/reference/settings/hardware.md',
        '/troubleshooting/common-issues(\\.md)?': '/help/common-issues.md',
        '/troubleshooting/error-messages(\\.md)?': '/help/error-messages.md',
        '/appendices/faq(\\.md)?': '/help/faq.md',
        '/appendices/glossary(\\.md)?': '/help/glossary.md',
        '/appendices/compatible-wallets(\\.md)?': '/help/compatible-wallets.md',
        '/appendices/resources(\\.md)?': '/help/resources.md',
        '/development/contributing-docs(\\.md)?': '/contribute/docs.md',
        '/development/contributing(\\.md)?': '/contribute/seedsigner.md',
        '/development/testnet(\\.md)?': '/contribute/testnet.md'
      },
      /* 0 = top-level sections start collapsed; active route is still expanded by the plugin */
      sidebarDisplayLevel: 0,
      plugins: [
        function sidebarSubheadingHeadings(hook) {
          hook.ready(function () {
            var nav = document.querySelector('.sidebar-nav');
            if (!nav) return;
            nav.addEventListener('click', function (e) {
              var li = e.target.closest('li.sidebar-subheading');
              if (li && !e.target.closest('a')) {
                e.stopImmediatePropagation();
              }
            }, true);
            /*
              On mobile, docsify closes the whole sidebar drawer on any click
              that bubbles to <body> while it's open (its own outside-tap-to-
              dismiss behavior). Tapping an L1 section only expands/collapses
              it in place (handled by docsify-sidebar-collapse's own bubble-
              phase listener on this same element), so once that's done, stop
              the click from bubbling further up to <body> — otherwise
              expanding "Reference" also closes the drawer, hiding the very
              items the tap just revealed. This runs in the bubble phase
              (after the collapse toggle fires) so the expand behavior itself
              is unaffected.
            */
            nav.addEventListener('click', function (e) {
              var rootUl = nav.querySelector(':scope > ul');
              var li = e.target.closest('li');
              if (rootUl && li && li.parentElement === rootUl && li.classList.contains('folder')) {
                e.stopPropagation();
              }
            });
          });
          hook.doneEach(function () {
            var rootUl = document.querySelector('.sidebar-nav > ul');
            if (!rootUl) return;
            document.querySelectorAll('.sidebar-nav li').forEach(function (li) {
              var nested = li.querySelector(':scope > ul:not(.app-sub-sidebar)');
              if (!nested) return;
              if (li.parentElement === rootUl) return;
              var hasDirectLink = Array.from(li.children).some(function (el) {
                return el.tagName === 'A' && el.getAttribute('href');
              });
              if (hasDirectLink) return;
              li.classList.remove('folder');
              li.classList.add('sidebar-subheading');
            });
          });
        }
      ]
    }
  </script>
  <!-- Docsify v4 (pinned to exact versions for reproducible builds) -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>

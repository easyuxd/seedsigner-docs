<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SeedSigner Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Official documentation for SeedSigner — an open-source, air-gapped Bitcoin signing device.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="theme-color" content="#f6851b">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0.9.0/dist/css/theme-simple.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1.3.5/dist/sidebar.min.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <style>
    :root {
      --theme-color: #f6851b;
      --sidebar-background: #fff;
      --sidebar-nav-background: #fff;
      --sidebar-nav-link-color--active: #f6851b;
      --sidebar-nav-link-border-color--active: #f6851b;
      --sidebar-name-color: #f6851b;
      --link-color: #f6851b;
      --link-color--hover: #d4710f;
      --blockquote-border-color: #f6851b;
      --notice-tip-border-color: #f6851b;
    }
    /*
      Active L1 (top-level section): orange for section title + chevron.
      Docsify often puts .active on the leaf li only; :has(> ul li.active) styles the open section row.
    */
    .sidebar-nav > ul > li.active > a,
    .sidebar-nav > ul > li:has(> ul li.active) > a {
      color: var(--theme-color, #f6851b) !important;
    }
    .sidebar-nav > ul > li.active > p,
    .sidebar-nav > ul > li.active > p strong,
    .sidebar-nav > ul > li.active > strong,
    .sidebar-nav > ul > li:has(> ul li.active) > p,
    .sidebar-nav > ul > li:has(> ul li.active) > p strong,
    .sidebar-nav > ul > li:has(> ul li.active) > strong {
      color: var(--theme-color, #f6851b) !important;
    }
    .sidebar-nav > ul > li.active.folder::before,
    .sidebar-nav > ul > li.active.folder.open::before,
    .sidebar-nav > ul > li.active.folder.collapse::before,
    .sidebar-nav > ul > li:has(> ul li.active).folder::before,
    .sidebar-nav > ul > li:has(> ul li.active).folder.open::before,
    .sidebar-nav > ul > li:has(> ul li.active).folder.collapse::before {
      border-right-color: var(--theme-color, #f6851b) !important;
      border-bottom-color: var(--theme-color, #f6851b) !important;
    }
    .sidebar .app-name {
      text-align: center;
      padding: 20px 0 10px;
    }
    .sidebar .app-name img {
      max-width: 160px;
    }
    /* Top-level direct page link (Home is a single page, not an expandable section): match section-header weight */
    .sidebar-nav > ul > li > a {
      font-weight: 700;
    }
    .markdown-section h1 {
      border-bottom: 2px solid #f6851b;
      padding-bottom: 0.3em;
    }
    .markdown-section table {
      display: table;
      width: 100%;
    }
    .warning-box {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 12px 16px;
      margin: 16px 0;
      border-radius: 4px;
    }
    .danger-box {
      background: #f8d7da;
      border-left: 4px solid #dc3545;
      padding: 12px 16px;
      margin: 16px 0;
      border-radius: 4px;
    }
    .tip-box {
      background: #d4edda;
      border-left: 4px solid #28a745;
      padding: 12px 16px;
      margin: 16px 0;
      border-radius: 4px;
    }
    /* === Diagram components (ss-*) ===================================
       Semantic HTML diagrams authored directly in markdown (see
       docs/contribute/docs.md → "Diagrams"). Conventions:
       blue = networked coordinator (left lane), orange = air-gapped
       SeedSigner (right lane), dashed line = the air gap.
       All colors flow through --ss-* tokens so a future dark mode only
       needs to override this one block. */
    :root {
      --ss-device-accent: var(--theme-color, #f6851b);
      --ss-device-accent-strong: #b35a08; /* >=4.5:1 with white text */
      --ss-device-bg: #fdf0e3;
      --ss-device-text: #8a4a00;
      --ss-computer-accent: #2f6bc4;
      --ss-computer-bg: #e9f0fa;
      --ss-computer-text: #1d4f91;
      --ss-diagram-bg: #fff;
      --ss-diagram-neutral-bg: #f4f6f8;
      --ss-diagram-border: #dde3ea;
      --ss-diagram-text: #3b454e;
      --ss-diagram-muted: #6a7580;
      --ss-warn-accent: #ffc107;
      --ss-warn-bg: #fff3cd;
      --ss-warn-text: #7a5b00;
    }
    .markdown-section .ss-diagram {
      margin: 1.5em 0;
      padding: 1.25rem 1.25rem 1rem;
      background: var(--ss-diagram-bg);
      border: 1px solid var(--ss-diagram-border);
      border-radius: 10px;
      color: var(--ss-diagram-text);
      font-size: 0.9rem;
      line-height: 1.45;
    }
    .markdown-section .ss-diagram ol,
    .markdown-section .ss-diagram ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .markdown-section .ss-caption {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--ss-diagram-muted);
    }
    .markdown-section .ss-sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
    /* Architecture panel (homepage) */
    .markdown-section .ss-arch-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      column-gap: 1rem;
      row-gap: 0.6rem;
      align-items: stretch;
    }
    .markdown-section .ss-node {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.15rem;
      padding: 0.85rem 1rem;
      border: 2px solid;
      border-radius: 8px;
      text-align: center;
      min-width: 0;
      overflow-wrap: break-word;
    }
    .markdown-section .ss-node--computer {
      border-color: var(--ss-computer-accent);
      background: var(--ss-computer-bg);
      color: var(--ss-computer-text);
    }
    .markdown-section .ss-node--device {
      border-color: var(--ss-device-accent);
      background: var(--ss-device-bg);
      color: var(--ss-device-text);
    }
    .markdown-section .ss-node-kicker {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.8;
    }
    .markdown-section .ss-node-title {
      font-size: 1.05rem;
    }
    .markdown-section .ss-node-sub {
      font-size: 0.8rem;
      opacity: 0.85;
    }
    .markdown-section .ss-airgap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0 0.5rem;
      min-width: 7.5rem;
    }
    .markdown-section .ss-airgap::before {
      content: "";
      position: absolute;
      top: -0.75rem;
      bottom: -0.75rem;
      left: 50%;
      border-left: 2px dashed var(--ss-device-accent);
    }
    .markdown-section .ss-airgap-label {
      position: relative;
      z-index: 1;
      padding: 0.1rem 0.35rem;
      background: var(--ss-diagram-bg);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ss-diagram-muted);
    }
    .markdown-section .ss-qr-link {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.6rem;
      border: 1.5px solid var(--ss-device-accent);
      border-radius: 999px;
      background: var(--ss-diagram-bg);
      color: var(--ss-device-text);
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .markdown-section .ss-endpoint {
      font-size: 0.8rem;
      text-align: center;
      color: var(--ss-diagram-muted);
    }
    /* Swimlane (two-lane step flow with the air gap down the middle) */
    .markdown-section .ss-lane-heads {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      column-gap: 1rem;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .markdown-section .ss-lane-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      font-weight: 700;
      text-align: center;
      min-width: 0;
    }
    .markdown-section .ss-lane-head em {
      font-style: normal;
      font-weight: 600;
      font-size: 0.66rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.75;
    }
    .markdown-section .ss-lane-head--computer {
      background: var(--ss-computer-bg);
      border-top: 3px solid var(--ss-computer-accent);
      color: var(--ss-computer-text);
    }
    .markdown-section .ss-lane-head--device {
      background: var(--ss-device-bg);
      border-top: 3px solid var(--ss-device-accent);
      color: var(--ss-device-text);
    }
    .markdown-section .ss-gap-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ss-diagram-muted);
      white-space: nowrap;
    }
    .markdown-section ol.ss-steps {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 2.75rem;
      row-gap: 0.5rem;
    }
    .markdown-section ol.ss-steps::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      border-left: 2px dashed var(--ss-device-accent);
    }
    .markdown-section li.ss-step {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 0.75rem;
      border-left: 3px solid;
      border-radius: 8px;
      min-width: 0;
      overflow-wrap: break-word;
    }
    .markdown-section li.ss-step--computer {
      grid-column: 1;
      border-left-color: var(--ss-computer-accent);
      background: var(--ss-computer-bg);
      color: var(--ss-computer-text);
    }
    .markdown-section li.ss-step--device {
      grid-column: 2;
      border-left-color: var(--ss-device-accent);
      background: var(--ss-device-bg);
      color: var(--ss-device-text);
    }
    .markdown-section li.ss-step--span {
      grid-column: 1 / -1;
      z-index: 1;
      border-left-color: var(--ss-diagram-muted);
      background: var(--ss-diagram-neutral-bg);
      color: var(--ss-diagram-text);
    }
    .markdown-section li.ss-step--handoff {
      grid-column: 1 / -1;
      z-index: 1;
      padding: 0;
      border-left: none;
      background: transparent;
    }
    .markdown-section .ss-handoff-half {
      flex: 1 1 0;
      padding: 0.6rem 0.75rem;
      border-left: 3px solid;
      border-radius: 8px;
      min-width: 0;
      overflow-wrap: break-word;
    }
    .markdown-section .ss-handoff-half--computer {
      border-left-color: var(--ss-computer-accent);
      background: var(--ss-computer-bg);
      color: var(--ss-computer-text);
    }
    .markdown-section .ss-handoff-half--device {
      border-left-color: var(--ss-device-accent);
      background: var(--ss-device-bg);
      color: var(--ss-device-text);
    }
    /* --warn is defined after the lane variants so it wins when combined */
    .markdown-section li.ss-step--warn {
      border-left-color: var(--ss-warn-accent);
      background: var(--ss-warn-bg);
      color: var(--ss-warn-text);
    }
    .markdown-section .ss-step-num {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 50%;
      background: var(--ss-diagram-text);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .markdown-section li.ss-step--computer .ss-step-num {
      background: var(--ss-computer-accent);
    }
    .markdown-section li.ss-step--device .ss-step-num {
      background: var(--ss-device-accent-strong);
    }
    .markdown-section .ss-step-body {
      flex: 1 1 auto;
      min-width: 0;
    }
    .markdown-section .ss-step-body small {
      display: block;
      font-size: 0.75rem;
      opacity: 0.8;
    }
    .markdown-section .ss-qr-badge {
      position: absolute;
      top: 50%;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      padding: 0.15rem 0.45rem;
      border: 1.5px solid var(--ss-device-accent);
      border-radius: 999px;
      background: var(--ss-diagram-bg);
      color: var(--ss-device-text);
      font-size: 0.68rem;
      font-weight: 700;
      white-space: nowrap;
    }
    /* Center the badge on the dashed air-gap line (half of the 2.75rem gap) */
    .markdown-section li.ss-step--device > .ss-qr-badge {
      left: -1.375rem;
      transform: translate(-50%, -50%);
    }
    .markdown-section li.ss-step--computer > .ss-qr-badge {
      right: -1.375rem;
      transform: translate(50%, -50%);
    }
    .markdown-section li.ss-step--handoff > .ss-qr-badge {
      position: static;
      transform: none;
      flex-shrink: 0;
    }
    .markdown-section .ss-lane-tag {
      display: none;
    }
    .markdown-section .ss-chip {
      flex-shrink: 0;
      padding: 0.1rem 0.45rem;
      border: 1px solid currentColor;
      border-radius: 999px;
      background: var(--ss-diagram-bg);
      font-size: 0.68rem;
      font-weight: 700;
    }
    /* Phase strip (build journey) */
    .markdown-section .ss-phases {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.4rem;
    }
    .markdown-section .ss-phases .ss-caption {
      grid-column: 1 / -1;
      margin-top: 0;
    }
    .markdown-section .ss-phase {
      position: relative;
      padding: 0.85rem 1rem;
      border: 1px solid var(--ss-diagram-border);
      border-top: 3px solid var(--ss-device-accent);
      border-radius: 8px;
      background: var(--ss-diagram-neutral-bg);
      min-width: 0;
    }
    .markdown-section .ss-phase + .ss-phase::before {
      content: "\2192";
      position: absolute;
      left: -1.15rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ss-diagram-muted);
      font-weight: 700;
    }
    .markdown-section .ss-phase--critical {
      border-top-color: var(--ss-warn-accent);
    }
    .markdown-section .ss-phase--critical .ss-phase-kicker {
      color: var(--ss-warn-text);
    }
    .markdown-section .ss-phase-kicker {
      display: block;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ss-diagram-muted);
    }
    .markdown-section .ss-phase-title {
      display: block;
      margin: 0.1rem 0 0.5rem;
      font-size: 1rem;
      color: var(--ss-diagram-text);
    }
    .markdown-section .ss-diagram ol.ss-phase-steps {
      list-style: decimal;
      padding-left: 1.4rem;
      font-size: 0.85rem;
    }
    .markdown-section ol.ss-phase-steps li {
      margin: 0.15rem 0;
    }
    /* Vertical flow (multisig journey) */
    .markdown-section ol.ss-flow {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    @media (max-width: 700px) {
      .markdown-section .ss-lane-heads {
        display: none;
      }
      .markdown-section ol.ss-steps {
        grid-template-columns: 1fr;
        column-gap: 0;
      }
      .markdown-section ol.ss-steps::before {
        display: none;
      }
      .markdown-section li.ss-step--computer,
      .markdown-section li.ss-step--device {
        grid-column: 1;
      }
      .markdown-section li.ss-step--handoff {
        flex-wrap: wrap;
      }
      .markdown-section .ss-lane-tag {
        display: inline-block;
        flex-shrink: 0;
        padding: 0.05rem 0.4rem;
        border-radius: 4px;
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #fff;
      }
      .markdown-section .ss-lane-tag--computer {
        background: var(--ss-computer-accent);
      }
      .markdown-section .ss-lane-tag--device {
        background: var(--ss-device-accent-strong);
      }
      .markdown-section li.ss-step--device > .ss-qr-badge,
      .markdown-section li.ss-step--computer > .ss-qr-badge {
        position: static;
        transform: none;
        margin-left: auto;
      }
      .markdown-section .ss-phases {
        grid-template-columns: 1fr;
        gap: 0.9rem;
      }
      .markdown-section .ss-phase + .ss-phase::before {
        content: "\2193";
        left: 50%;
        top: -1.05rem;
        transform: translateX(-50%);
      }
      .markdown-section .ss-arch-grid {
        grid-template-columns: 1fr;
      }
      .markdown-section .ss-arch-grid .ss-node--computer { order: 1; }
      .markdown-section .ss-arch-grid .ss-endpoint--computer { order: 2; }
      .markdown-section .ss-arch-grid .ss-airgap { order: 3; }
      .markdown-section .ss-arch-grid .ss-node--device { order: 4; }
      .markdown-section .ss-arch-grid .ss-endpoint--device { order: 5; }
      .markdown-section .ss-arch-spacer {
        display: none;
      }
      .markdown-section .ss-airgap {
        flex-direction: row;
        justify-content: center;
        gap: 0.6rem;
        padding: 0.4rem 0;
        min-width: 0;
      }
      .markdown-section .ss-airgap::before {
        top: 50%;
        bottom: auto;
        left: 0;
        right: 0;
        border-left: none;
        border-top: 2px dashed var(--ss-device-accent);
      }
      /* Stacked nodes exchange up/down, so rotate the QR pill arrows */
      .markdown-section .ss-qr-link span[aria-hidden] {
        display: inline-block;
        transform: rotate(90deg);
      }
    }
    @media print {
      .markdown-section .ss-diagram {
        break-inside: avoid;
        border-color: #999;
      }
      .markdown-section .ss-step-num,
      .markdown-section .ss-lane-tag {
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
    }
    /* === End diagram components === */
    /* Nested sidebar labels (no page link): heading only, no chevron, links always visible */
    .sidebar-nav li.sidebar-subheading {
      cursor: default;
      margin-bottom: 0 !important;
    }
    .sidebar-nav li.sidebar-subheading::before {
      display: none !important;
    }
    .sidebar-nav li.sidebar-subheading > ul {
      display: block !important;
      margin-left: 0 !important;
    }
    .sidebar-nav > ul > li > ul > li.sidebar-subheading > p {
      margin-top: 0.5em !important;
    }
    .sidebar-nav > ul > li > ul > li.sidebar-subheading > strong {
      margin-top: 1.5em !important;
    }
    .sidebar-nav > ul > li > ul > li.sidebar-subheading p strong {
      margin-top: 0 !important;
    }
    /* L2 subheads: no underline (theme uses border-bottom on strong) */
    .sidebar-nav li.sidebar-subheading > p,
    .sidebar-nav li.sidebar-subheading > strong,
    .sidebar-nav li.sidebar-subheading p,
    .sidebar-nav li.sidebar-subheading strong {
      border: none !important;
      border-bottom: none !important;
      text-decoration: none !important;
      margin-bottom: 0 !important;
    }
    /*
      L2 under a top-level section: same left inset for direct links (Quick-start checklist)
      and subheadings (SEEDS, BUILD YOUR DEVICE). Section list stays flush; each L2 li indents.
    */
    .sidebar-nav > ul > li > ul {
      margin-left: 0 !important;
      padding-left: 0 !important;
    }
    .sidebar-nav > ul > li > ul > li {
      margin-left: var(--sidebar-nav-indent, 1em) !important;
    }
    .sidebar-nav > ul > li > ul ul {
      margin-left: var(--sidebar-nav-indent, 1em) !important;
    }
    /* Direct L2 page links only (not links inside a subheading’s nested ul) */
    .sidebar-nav > ul > li > ul > li > a[href^="#/"]:not([href*="?id="]),
    .sidebar-nav > ul > li > ul > li > a[href^="/"]:not([href*="?id="]) {
      padding-left: var(--sidebar-nav-link-padding, 0.25em 0) !important;
      font-size: 0.9rem !important;
    }
    /* Top-level section chevron (docsify-sidebar-collapse): align to the right, mirror so open/closed still read correctly */
    .sidebar-nav > ul > li.folder:not(.sidebar-subheading) {
      padding-right: 1.1rem;
    }
    .sidebar-nav > ul > li.folder:not(.sidebar-subheading)::before {
      left: auto !important;
      right: 0.15rem;
      border-right-color: var(--sidebar-nav-link-color, var(--base-color, #505d6b)) !important;
      border-bottom-color: var(--sidebar-nav-link-color, var(--base-color, #505d6b)) !important;
      transform: scaleX(-1) rotate(135deg) !important;
    }
    .sidebar-nav > ul > li.folder:not(.sidebar-subheading).open::before {
      transform: scaleX(-1) rotate(45deg) !important;
    }
    .sidebar-nav > ul > li.folder:not(.sidebar-subheading).collapse::before {
      transform: scaleX(-1) rotate(135deg) !important;
    }
    /*
      Two sources of nested “chevrons”:
      1) docsify-sidebar-collapse: li::before triangle
      2) docsify-themeable: --sidebar-nav-pagelink-* backgrounds on any a:not(:only-child)
      Keep expand affordance only on top-level section rows (.sidebar-nav > ul > li).
    */
    .sidebar-nav > ul > li ul li::before,
    .sidebar-nav > ul > li ul li.open::before,
    .sidebar-nav > ul > li ul li.collapse::before {
      content: none !important;
      display: none !important;
      border: none !important;
      width: 0 !important;
      height: 0 !important;
      transform: none !important;
    }
    .sidebar-nav > ul > li ul a[href^="#/"]:not([href*="?id="]),
    .sidebar-nav > ul > li ul a[href^="/"]:not([href*="?id="]) {
      background: var(--sidebar-nav-link-background, transparent) !important;
    }
    /* Under an L2 subheading: no extra ul margin (above) and no theme pagelink left padding */
    .sidebar-nav li.sidebar-subheading ul a[href^="#/"]:not([href*="?id="]),
    .sidebar-nav li.sidebar-subheading ul a[href^="/"]:not([href*="?id="]) {

<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '<img src="images/SeedSigner_Logo.png" alt="SeedSigner" />',
      nameLink: '/',
      //repo: 'https://github.com/SeedSigner/seedsigner',
      loadNavbar: true,
      loadSidebar: true,
      /* 0 = do not inject in-page heading anchors under the active sidebar link */
      subMaxLevel: 0,
      auto2top: true,
      search: {
        placeholder: 'Search docs...',
        noData: 'No results found.',
        paths: 'auto',
        depth: 3,
        /* Bump when page content changes shape (e.g. the diagram rework) so
           returning visitors don't search a stale localStorage index. */
        namespace: 'seedsigner-docs-v2'
      },
      copyCode: {
        buttonText: 'Copy',
        successText: 'Copied'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true
      },
      themeColor: '#f6851b',
      notFoundPage: true,
      /*
        Redirects for the pre-restructure URLs. Each old route (with or without a
        trailing .md) resolves to its new location so existing bookmarks and inbound
        links keep working after the journey-first IA move.
      */
      alias: {
        '/overview(\\.md)?': '/README.md',
        '/getting-started/checklist(\\.md)?': '/get-started/build-device.md',
        '/getting-started/first-boot(\\.md)?': '/reference/device/first-boot.md',
        '/getting-started/navigation(\\.md)?': '/reference/device/navigation.md',
        '/getting-started/power-off(\\.md)?': '/reference/device/power.md',
        '/hardware-build/components(\\.md)?': '/reference/hardware/components.md',
        '/hardware-build/sourcing(\\.md)?': '/reference/hardware/sourcing.md',
        '/hardware-build/assembly(\\.md)?': '/reference/hardware/assembly.md',
        '/hardware-build/enclosures(\\.md)?': '/reference/hardware/enclosures.md',
        '/software-setup/download-and-verify(\\.md)?': '/reference/software/verify-image.md',
        '/software-setup/write-sd-card(\\.md)?': '/reference/software/flash-sd-card.md',
        '/software-setup/first-run(\\.md)?': '/reference/software/first-run.md',
        '/using-seedsigner/single-sig-walkthrough(\\.md)?': '/get-started/first-wallet.md',
        '/using-seedsigner/create-seed(\\.md)?': '/reference/seeds/creation.md',
        '/using-seedsigner/load-seed(\\.md)?': '/reference/seeds/loading.md',
        '/using-seedsigner/seedqr-backup(\\.md)?': '/reference/seeds/seedqr.md',
        '/using-seedsigner/view-seeds(\\.md)?': '/reference/seeds/verification.md',
        '/using-seedsigner/discard-seed(\\.md)?': '/reference/seeds/discard.md',
        '/using-seedsigner/export-xpub(\\.md)?': '/reference/keys/xpub-export.md',
        '/using-seedsigner/addresses(\\.md)?': '/reference/keys/address-explorer.md',
        '/using-seedsigner/sign-transaction(\\.md)?': '/reference/keys/psbt-signing.md',
        '/security/multisig-walkthrough(\\.md)?': '/get-started/multisig.md',
        '/security/multisig-spend(\\.md)?': '/reference/multisig/spending.md',
        '/security/wallet-descriptor(\\.md)?': '/reference/multisig/descriptor.md',
        '/configuration/basic(\\.md)?': '/reference/settings/basic.md',
        '/configuration/advanced(\\.md)?': '/reference/settings/advanced.md',
        '/configuration/hardware(\\.md)?': '/reference/settings/hardware.md',
        '/troubleshooting/common-issues(\\.md)?': '/help/common-issues.md',
        '/troubleshooting/error-messages(\\.md)?': '/help/error-messages.md',
        '/appendices/faq(\\.md)?': '/help/faq.md',
        '/appendices/glossary(\\.md)?': '/help/glossary.md',
        '/appendices/compatible-wallets(\\.md)?': '/help/compatible-wallets.md',
        '/appendices/resources(\\.md)?': '/help/resources.md',
        '/development/contributing-docs(\\.md)?': '/contribute/docs.md',
        '/development/contributing(\\.md)?': '/contribute/seedsigner.md',
        '/development/testnet(\\.md)?': '/contribute/testnet.md'
      },
      /* 0 = top-level sections start collapsed; active route is still expanded by the plugin */
      sidebarDisplayLevel: 0,
      plugins: [
        function sidebarSubheadingHeadings(hook) {
          hook.ready(function () {
            var nav = document.querySelector('.sidebar-nav');
            if (!nav) return;
            nav.addEventListener('click', function (e) {
              var li = e.target.closest('li.sidebar-subheading');
              if (li && !e.target.closest('a')) {
                e.stopImmediatePropagation();
              }
            }, true);
            /*
              On mobile, docsify closes the whole sidebar drawer on any click
              that bubbles to <body> while it's open (its own outside-tap-to-
              dismiss behavior). Tapping an L1 section only expands/collapses
              it in place (handled by docsify-sidebar-collapse's own bubble-
              phase listener on this same element), so once that's done, stop
              the click from bubbling further up to <body> — otherwise
              expanding "Reference" also closes the drawer, hiding the very
              items the tap just revealed. This runs in the bubble phase
              (after the collapse toggle fires) so the expand behavior itself
              is unaffected.
            */
            nav.addEventListener('click', function (e) {
              var rootUl = nav.querySelector(':scope > ul');
              var li = e.target.closest('li');
              if (rootUl && li && li.parentElement === rootUl && li.classList.contains('folder')) {
                e.stopPropagation();
              }
            });
          });
          hook.doneEach(function () {
            var rootUl = document.querySelector('.sidebar-nav > ul');
            if (!rootUl) return;
            document.querySelectorAll('.sidebar-nav li').forEach(function (li) {
              var nested = li.querySelector(':scope > ul:not(.app-sub-sidebar)');
              if (!nested) return;
              if (li.parentElement === rootUl) return;
              var hasDirectLink = Array.from(li.children).some(function (el) {
                return el.tagName === 'A' && el.getAttribute('href');
              });
              if (hasDirectLink) return;
              li.classList.remove('folder');
              li.classList.add('sidebar-subheading');
            });
          });
        }
      ]
    }
  </script>
